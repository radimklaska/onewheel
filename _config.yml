title: OneWheel technical info
tagline: Deep dive into OneWheel internals
email: radim@klaska.net
description: >
  Deep dive into OneWheel internals
remote_theme: chrisrhymes/bulma-clean-theme@v1.3.1

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
baseurl: ""
# The site is served from the onewheel.klaska.net custom domain; both
# radimklaska.github.io/onewheel/ and the old klaska.net/onewheel/ redirect here.
# `url` must name the canonical host or every canonical tag points at a redirect.
url: "https://onewheel.klaska.net"
permalink: pretty
sponsor_url: "https://klaska.net/support/"
markdown: kramdown
highlighter: rouge
fixed_navbar: top

# Repo tooling that must not be published (Jekyll's defaults, such as Gemfile and
# node_modules, stay excluded too).
exclude:
  - readme.md
  - wrangler.jsonc
  - package.json
  - package-lock.json
  - playwright.config.js
  - tests/
  - visual-diffs/
  - visual-results/
  - visual-report/
  - lighthouse/
