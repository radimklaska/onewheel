name: Link Checker

on:
  schedule:
    - cron: '0 7 * * 1' # Every Monday at 7:00 UTC
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: '.ruby-version'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # This site is published under a base path, so its internal links look like
      # /onewheel/bms/ while _site/ holds bms/ at its root. Staging the build under a
      # matching directory lets lychee resolve those links instead of reporting every
      # one of them as broken.
      - name: Stage site at its published base path
        run: |
          mkdir -p _linkcheck/onewheel
          cp -r _site/. _linkcheck/onewheel/

      # --remap: the generated feed.xml and robots.txt reference the production host
      #   absolutely. Resolved as-is they would test the currently deployed site
      #   rather than the build under test, so any PR adding a page would fail
      #   because that page is not live yet. Remapping points them at the build.
      #
      # --exclude: each of these was confirmed to be blocked rather than broken, and
      #   the two groups fail for different reasons:
      #
      #   digikey.com, microchip.com - 403 to any automated client, including with a
      #     browser user-agent, from any network.
      #   reddit.com, instagram.com - reachable from a normal connection but 403/429
      #     from GitHub's runner IPs, which are datacentre ranges these sites
      #     rate-limit. They pass when the checker is run locally, so a local run is
      #     not sufficient evidence that a domain is fine in CI.
      #
      #   Everything else, including mouser and facebook, passes from CI and stays
      #   checked. Add a domain here only after confirming from a CI run that the
      #   failure is blocking rather than a genuinely broken link.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/_linkcheck
            --remap "https://klaska.net/onewheel/ file://${{ github.workspace }}/_linkcheck/onewheel/"
            --exclude digikey\.com
            --exclude microchip\.com
            --exclude reddit\.com
            --exclude instagram\.com
            _linkcheck/
          fail: true

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not set; skipping notification."
            exit 0
          fi
          payload=$(jq -n --arg url "$RUN_URL" \
            '{content: ("Broken links detected on klaska.net/onewheel! Report: " + $url)}')
          curl -s -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK"
